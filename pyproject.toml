[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precinct-gap-finder"
version = "0.1.0"
description = "Compare each NYPD precinct's 311 service with the citywide norm, using NYC Open Data."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.31", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pgf = "pgf.cli:main"

[tool.setuptools.packages.find]
include = ["pgf*"]

[tool.setuptools.package-data]
pgf = ["templates/*.j2"]
